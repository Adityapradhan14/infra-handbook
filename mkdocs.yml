site_name: Infra Handbook
site_author: Aditya Pradhan
site_url: https://adityapradhan14.github.io/infra-handbook/
repo_url: https://github.com/Adityapradhan14/infra-handbook
repo_name: Adityapradhan14/infra-handbook
theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Light mode
    - scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Dark mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Linux:
      - Overview: linux/index.md
